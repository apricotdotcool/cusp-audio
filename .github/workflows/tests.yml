name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.14"
      - name: Run ruff check
        run: uv run --frozen ruff check .
      - name: Run ruff format check
        run: uv run --frozen ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install portaudio (Linux)
        if: runner.os == 'Linux'
        # PortAudio 19.7+ (ubuntu-latest >= 26.04) is built with the PulseAudio
        # host API, and Pa_Initialize() fails outright when no sound server is
        # reachable. Start a headless PulseAudio with a null sink so that
        # `import sounddevice` succeeds on the runner.
        run: |
          sudo apt-get install -y libportaudio2 pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy
      - name: Install portaudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests on Python ${{ matrix.python-version }}
        run: uv run --frozen pytest -v
